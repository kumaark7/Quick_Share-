<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Quick Share</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell admin-shell">
    <section class="page-card admin-card">
      <section id="adminLoginCard" class="admin-login-card">
        <div class="page-copy admin-copy">
          <h1>Secure Admin Access</h1>
          <p>Authorized access only.</p>
        </div>

        <form id="adminLoginForm" class="auth-form admin-login-form">
          <label class="field">
            <span>Username</span>
            <input id="adminUsername" type="text" placeholder="Admin username" autocomplete="username">
          </label>
          <label class="field">
            <span>Password</span>
            <div class="password-field">
              <input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password">
              <button class="password-toggle" type="button" data-toggle-password="#adminPassword" aria-label="Show password">Show</button>
            </div>
          </label>
          <div class="auth-actions">
            <button class="button" type="submit">Open Admin Panel</button>
          </div>
          <p id="adminLoginStatus" class="status"></p>
        </form>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/admin.js"></script>
</body>
</html>
